# Comprueba el proyecto en cada cambio y publica la web en GitHub Pages desde main.
name: Comprobar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Temario y páginas al día
        run: npm run check
      - name: Pruebas (laboratorios, contenido, seguridad, RLS de la base de datos)
        run: npm test
      - name: Migraciones de Supabase y pruebas de seguridad del panel del profesor
        run: scripts/probar-sql.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  # Sube a Supabase el contenido de pago (no está en la web publicada). Sin el secreto SUPABASE_DB_URL falla y no se publica.
  contenido:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Subir el contenido de pago a Supabase
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          scripts/subir-premium.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [comprobar, contenido]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Preparar solo los archivos públicos
        run: |
          mkdir _site
          cp -r *.html manifest.webmanifest css js data img vendor sw.js .well-known _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
