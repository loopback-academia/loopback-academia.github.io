# Escaneo de seguridad del código (CodeQL): busca vulnerabilidades como XSS, inyecciones o permisos excesivos en los
# flujos de trabajo. Se ejecuta en cada cambio, en cada pull request y una vez por semana. Los hallazgos aparecen en
# la pestaña Security del repositorio.
name: Seguridad del código

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.lenguaje }}
          config-file: ./.github/codeql/config.yml
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.lenguaje }}
